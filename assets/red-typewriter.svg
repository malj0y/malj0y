<svg xmlns="http://www.w3.org/2000/svg" width="900" height="92" viewBox="0 0 900 92" role="img" aria-label="Malware and Exploits are the programmatic expression of my will, I live for this shit">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal">
      <rect x="30" y="18" width="0" height="58">
        <animate attributeName="width" values="0;830;830;0" keyTimes="0;0.68;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="892" height="84" rx="10" fill="#080808" stroke="#8b0000" stroke-width="2"/>
  <rect x="13" y="13" width="874" height="66" rx="7" fill="none" stroke="#2b0000" stroke-width="1"/>
  <g clip-path="url(#reveal)" filter="url(#glow)">
    <text x="30" y="57" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#ff1a1a">Malware and Exploits are the programmatic expression of my will, I live for this shit</text>
  </g>
  <rect x="32" y="34" width="3" height="28" fill="#ff1a1a" filter="url(#glow)">
    <animate attributeName="x" values="32;862;862;32" keyTimes="0;0.68;0.9;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" dur="0.75s" repeatCount="indefinite"/>
  </rect>
  <circle cx="858" cy="46" r="3" fill="#ff1a1a">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>